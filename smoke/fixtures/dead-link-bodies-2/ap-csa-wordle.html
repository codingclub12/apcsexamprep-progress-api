        border-color: var(--accent);

        background: var(--accent);

    .word-length-indicator {

    .tile {
        width: 52px;
        height: 52px;
        background: var(--bg-tile);
        border: 2px solid var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.4rem;
        font-weight: 700;
        text-transform: uppercase;
        transition: all 0.15s ease;
    }

    .tile.small {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
    }

    .tile.filled {
        border-color: var(--text-secondary);
        animation: pop 0.1s ease;
    }

    .tile.correct {
        background: var(--correct);
        border-color: var(--correct);
        color: #000;
    }

    .tile.present {
        background: var(--present);
        border-color: var(--present);
        color: #000;
    }

    .tile.absent {
        background: var(--absent);
        border-color: var(--absent);
    }

    .tile.reveal {
        animation: flip 0.5s ease forwards;
    }

    @keyframes pop {
        50% { transform: scale(1.1); }
    }

    @keyframes flip {
        0% { transform: rotateX(0); }
        50% { transform: rotateX(90deg); }
        100% { transform: rotateX(0); }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-5px); }
        40%, 80% { transform: translateX(5px); }
    }

    .shake {
        animation: shake 0.4s ease;
    }

    .keyboard {

        width: 100%;

          tip: 'Java has single inheritance - a class can only extend ONE other class. But it can implement multiple interfaces.' },
        
        { word: 'println', unit: 'Unit 1', title: 'Print with Newline',

          tip: 'println() with no argument just prints a blank line. Use print() (no ln) to stay on the same line.' },
        
        // 8-letter words

    const KEYBOARD_ROWS = [
        ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
        ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
        ['enter', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'back']
    ];

    let currentWord = null;
    let wordLength = 5;
    let currentRow = 0;
    let currentTile = 0;
    let gameOver = false;
    let guesses = [];
    let keyStates = {};
    let mode = 'fixed'; // 'fixed' or 'random'

    // Stats
    let stats = JSON.parse(localStorage.getItem('javaWordleStats2')) || {
        played: 0,
        wins: 0,
        streak: 0,
        maxStreak: 0
    };

    function init() {
        selectNewWord();
        createBoard();
        createKeyboard();
        updateStats();
        updateWordCount();
        
        document.addEventListener('keydown', handleKeyPress);
        document.getElementById('newGameBtn').addEventListener('click', resetGame);
        
        // Mode selector
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const length = btn.dataset.length;
                if (length === 'random') {
                    mode = 'random';
                    wordLength = getRandomLength();
                } else {
                    mode = 'fixed';
                    wordLength = parseInt(length);
                }
                
                document.getElementById('lengthDisplay').textContent = wordLength;
                updateWordCount();
                resetGame();
            });
        });
    }

    function getRandomLength() {
        const lengths = [3, 4, 5, 6, 7, 8];
        const availableLengths = lengths.filter(len => 
            WORDS.some(w => w.word.length === len)
        );
        return availableLengths[Math.floor(Math.random() * availableLengths.length)];
    }

    function getWordsOfLength(len) {
        return WORDS.filter(w => w.word.length === len);
    }

    function updateWordCount() {
        const count = mode === 'random' ? WORDS.length : getWordsOfLength(wordLength).length;
        document.getElementById('wordCountDisplay').textContent = count;
    }

    function selectNewWord() {
        if (mode === 'random') {
            wordLength = getRandomLength();
            document.getElementById('lengthDisplay').textContent = wordLength;
        }
        
        const availableWords = getWordsOfLength(wordLength);
        currentWord = availableWords[Math.floor(Math.random() * availableWords.length)];
    }

    function createBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        
        const maxAttempts = wordLength <= 4 ? 5 : 6;
        const tileClass = wordLength >= 7 ? 'tile small' : 'tile';
        
        for (let i = 0; i < maxAttempts; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            row.id = `row-${i}`;
            
            for (let j = 0; j < wordLength; j++) {
                const tile = document.createElement('div');
                tile.className = tileClass;
                tile.id = `tile-${i}-${j}`;
                row.appendChild(tile);
            }
            
            board.appendChild(row);
        }
    }

    function createKeyboard() {
        const keyboard = document.getElementById('keyboard');
        keyboard.innerHTML = '';
        keyStates = {};
        
        KEYBOARD_ROWS.forEach(row => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'keyboard-row';
            
            row.forEach(key => {
                const keyBtn = document.createElement('button');
                keyBtn.className = 'key' + (key.length > 1 ? ' wide' : '');
                keyBtn.textContent = key === 'back' ? 'DEL' : key;
                keyBtn.dataset.key = key;
                keyBtn.addEventListener('click', () => handleInput(key));
                rowDiv.appendChild(keyBtn);
            });
            
            keyboard.appendChild(rowDiv);
        });
    }

    function handleKeyPress(e) {
        if (gameOver) return;
        
        const key = e.key.toLowerCase();
        
        if (key === 'enter') {
            handleInput('enter');
        } else if (key === 'backspace') {
            handleInput('back');
        } else if (/^[a-z]$/.test(key)) {
            handleInput(key);
        }
    }

    function handleInput(key) {
        if (gameOver) return;
        
        if (key === 'enter') {
            submitGuess();
        } else if (key === 'back') {
            deleteLetter();
        } else if (currentTile < wordLength) {
            addLetter(key);
        }
    }

    function addLetter(letter) {
        const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
        tile.textContent = letter;
        tile.classList.add('filled');
        currentTile++;
    }

    function deleteLetter() {
        if (currentTile > 0) {
            currentTile--;
            const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
            tile.textContent = '';
            tile.classList.remove('filled');
        }
    }

    function submitGuess() {
        if (currentTile < wordLength) {
            showMessage('Not enough letters', 'error');
            shakeRow();
            return;
        }

        let guess = '';
        for (let i = 0; i < wordLength; i++) {
            guess += document.getElementById(`tile-${currentRow}-${i}`).textContent;
        }
        guess = guess.toLowerCase();
        guesses.push(guess);

        revealGuess(guess);
    }

    function revealGuess(guess) {
        const row = document.getElementById(`row-${currentRow}`);
        const tiles = row.querySelectorAll('.tile');
        const wordArray = currentWord.word.toLowerCase().split('');
        const guessArray = guess.split('');
        const result = new Array(wordLength).fill('absent');

        // First pass: find correct letters
        for (let i = 0; i < wordLength; i++) {
            if (guessArray[i] === wordArray[i]) {
                result[i] = 'correct';
                wordArray[i] = null;
            }
        }

        // Second pass: find present letters
        for (let i = 0; i < wordLength; i++) {
            if (result[i] !== 'correct') {
                const idx = wordArray.indexOf(guessArray[i]);
                if (idx !== -1) {
                    result[i] = 'present';
                    wordArray[idx] = null;
                }
            }
        }

        // Animate tiles
        tiles.forEach((tile, i) => {
            setTimeout(() => {
                tile.classList.add('reveal', result[i]);
                updateKeyboard(guessArray[i], result[i]);
            }, i * 100);
        });

        const maxAttempts = wordLength <= 4 ? 5 : 6;
        
        // Check win/lose after animation
        setTimeout(() => {
            if (guess === currentWord.word.toLowerCase()) {
                gameWon();
            } else if (currentRow === maxAttempts - 1) {
                gameLost();
            } else {
                currentRow++;
                currentTile = 0;
            }
        }, wordLength * 100 + 300);
    }

    function updateKeyboard(letter, state) {
        const key = document.querySelector(`[data-key="${letter}"]`);
        if (!key) return;

        const currentState = keyStates[letter];
        
        if (state === 'correct') {
            key.className = 'key correct';
            keyStates[letter] = 'correct';
        } else if (state === 'present' && currentState !== 'correct') {
            key.className = 'key present';
            keyStates[letter] = 'present';
        } else if (!currentState) {
            key.className = 'key absent';
            keyStates[letter] = 'absent';
        }
    }

    function showDefinition() {
        const card = document.getElementById('definitionCard');
        document.getElementById('defWord').textContent = currentWord.word;
        document.getElementById('defUnit').textContent = currentWord.unit;
        document.getElementById('defTitle').textContent = currentWord.title;
        document.getElementById('defText').textContent = currentWord.definition;
        document.getElementById('defExample').textContent = currentWord.example;
        document.getElementById('defTip').innerHTML = '<strong>Exam Tip:</strong> ' + currentWord.tip;
        card.classList.add('show');
    }

    function gameWon() {
        gameOver = true;
        const messages = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
        showMessage(messages[Math.min(currentRow, messages.length - 1)], 'success');
        
        stats.played++;
        stats.wins++;
        stats.streak++;
        if (stats.streak > stats.maxStreak) {
            stats.maxStreak = stats.streak;
        }
        saveStats();
        updateStats();
        
        showDefinition();
        document.getElementById('newGameBtn').classList.add('show');
    }

    function gameLost() {
        gameOver = true;
        showMessage(`The word was: ${currentWord.word.toUpperCase()}`, 'info');
        
        stats.played++;
        stats.streak = 0;
        saveStats();
        updateStats();
        
        showDefinition();
        document.getElementById('newGameBtn').classList.add('show');
    }

    function showMessage(text, type) {
        const message = document.getElementById('message');
        message.textContent = text;
        message.className = `message show ${type}`;
        
        if (type !== 'info' || !gameOver) {
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        }
    }

    function shakeRow() {
        const row = document.getElementById(`row-${currentRow}`);
        row.classList.add('shake');
        setTimeout(() => row.classList.remove('shake'), 400);
    }

    function resetGame() {
        currentRow = 0;
        currentTile = 0;
        gameOver = false;
        guesses = [];
        
        selectNewWord();
        createBoard();
        createKeyboard();
        updateWordCount();
        
        document.getElementById('definitionCard').classList.remove('show');
        document.getElementById('newGameBtn').classList.remove('show');
        document.getElementById('message').classList.remove('show');
    }

    function saveStats() {
        localStorage.setItem('javaWordleStats2', JSON.stringify(stats));
    }

    function updateStats() {
        document.getElementById('played').textContent = stats.played;
        document.getElementById('winRate').textContent = 
            stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
        document.getElementById('streak').textContent = stats.streak;
        document.getElementById('maxStreak').textContent = stats.maxStreak;
    }

    init();
</script>

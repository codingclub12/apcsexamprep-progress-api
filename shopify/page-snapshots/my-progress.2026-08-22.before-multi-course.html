<!-- APCSExamPrep Student Progress - /pages/my-progress -->
<!-- Navy redesign to match the teacher dashboard. Reads /api/student/progress. -->
<!--
  POINTS EARNED OVER POINTS POSSIBLE.

  Every denominator on this page comes from the API, which resolves it through
  the same authority the teacher and admin gradebooks use. This page must never
  invent one.

  It used to. A constant table lived here:

      const POINTS={'lesson':10,'exercise-1':5,'exercise-2':5,'quiz':10,...}

  and every cell rescaled the stored percent onto it. The constants were wrong
  (Cyber 1.1 Exercise 1 is out of 7, not 5; its quiz is out of 5, not 10) and the
  rounding MOVED THE GRADE:

      teacher saw            this page showed
      25/100 = 25 percent    3/10 = 30
      17/100 = 17 percent    1/5  = 20
      3.04/8 = 38 percent    2/5  = 40

  Only an exact 0 or 100 survived. A student and their teacher were looking at
  different numbers for the same work.

  The percentages were also means of percentages, so a 5 point quiz counted the
  same as a 25 point exam, and a student's overall grade moved when they started
  a new item without answering anything differently. Points are summed now:
  earned over the possible of the work actually attempted.

  A graded cell shows a pair wherever the points are known. Where nobody has
  authored a total, the cell shows its PERCENT ALONE, marked with a *, and is
  left out of the points total on both sides.

  An interim version printed those cells as "17/100" instead. The percentage was
  right, but the 100 was not a number anyone chose: it outweighed a real 5 mark
  quiz twenty to one in the total, and it produced course totals like "71 / 127"
  whose denominator appears on no page. Unknown points are shown as unknown.
-->

<div id="stprog-wrap">
<div class="sp-page">
  <div class="sp-wrap">

    <div id="sp-auth" class="sp-auth sp-hidden">
      <h1>See your progress</h1>
      <p>Sign in with your class code, name, and PIN to view your scores.</p>
      <a class="sp-btn primary" href="/pages/join">Sign in</a>
    </div>

    <div id="sp-main" class="sp-hidden">
      <div class="sp-top">
        <div class="sp-id">
          <div class="sp-av" id="sp-av" aria-hidden="true">--</div>
          <div>
            <h1 class="sp-name" id="sp-name">Student</h1>
            <div class="sp-sub">
              <span class="sp-tag" id="sp-course">Course</span>
              <span id="sp-class"></span>
            </div>
          </div>
        </div>
        <button class="sp-btn" onclick="StProg.logout()">Sign out</button>
      </div>

      <div id="sp-loading" class="sp-note" role="status" aria-live="polite">Loading your progress...</div>
      <div id="sp-error" class="sp-err sp-hidden" role="alert"></div>

      <div id="sp-body" class="sp-hidden">
        <div class="sp-stats" id="sp-stats"></div>
        <div class="sp-pass" id="sp-pass"></div>
        <div id="sp-units"></div>
        <div class="sp-legend" aria-hidden="true">
          <span class="k"><span class="sw g"></span> 80 and up</span>
          <span class="k"><span class="sw a"></span> 60 to 79</span>
          <span class="k"><span class="sw r"></span> below 60</span>
          <span class="k"><span class="sw n"></span> not started</span>
        </div>
      </div>

  </div>

<script>
(function(){
const API='https://progress.apcsexamprep.com';
const ACTS=['lesson','exercise-1','exercise-2','quiz'];
const ACT_LABEL={'lesson':'Lesson','exercise-1':'Ex 1','exercise-2':'Ex 2','quiz':'Quiz','exam':'Exam','case_file':'Case File','case-file':'Case File','qotd':'Daily','study-guide':'Study Guide'};

window.StProg={
  student:null,
  threshold:80,
  denominators:{},

  init(){
    const t=localStorage.getItem('apcse_token'); const sj=localStorage.getItem('apcse_student');
    if(!t||!sj){ document.getElementById('sp-auth').classList.remove('sp-hidden'); return; }
    try{ this.student=JSON.parse(sj); }catch(e){ this.student={}; }
    document.getElementById('sp-main').classList.remove('sp-hidden');
    const nm=this.student.name||'Student';
    document.getElementById('sp-name').textContent=nm;
    document.getElementById('sp-av').textContent=nm.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'S';
    document.getElementById('sp-course').textContent=this.student.courseName||this.formatCourse(this.student.course)||'Course';
    document.getElementById('sp-class').textContent=this.student.className?('Class: '+this.student.className):'';
    this.load(t);
  },

  async load(token){
    try{
      const r=await fetch(API+'/api/student/progress',{headers:{'Authorization':'Bearer '+token}});
      if(r.status===401){ this.logout(); return; }
      if(!r.ok) throw new Error('status '+r.status);
      const data=await r.json();
      const rows=Array.isArray(data)?data:(data.progress||data.rows||[]);
      this.threshold=(data && (data.mastery_threshold || (data.class && data.class.mastery_threshold))) || 80;
      // The authored "out of" per lesson and activity, resolved server side by
      // the same authority the teacher gradebook uses. Absent means nobody has
      // authored one for that column, and the cell shows a bare percent.
      this.denominators=(data && data.denominators) || {};
      this.model=this.buildModel(rows);
      document.getElementById('sp-loading').classList.add('sp-hidden');
      document.getElementById('sp-body').classList.remove('sp-hidden');
      this.renderStats(); this.renderUnits();
    }catch(e){
      document.getElementById('sp-loading').classList.add('sp-hidden');
      const el=document.getElementById('sp-error'); el.textContent='Could not load your progress. Please refresh and try again.'; el.classList.remove('sp-hidden');
    }
  },

  // The denominator for a column. Unit-scoped key first, because every Cyber
  // unit has a lesson called 'exam' and a lesson called 'case-file'.
  possibleFor(unit,lesson,act){
    const d=this.denominators;
    const u=d[unit+'|'+lesson+'|'+act];
    if(u!=null) return u;
    const k=d[lesson+'|'+act];
    return k==null?null:k;
  },

  buildModel(rows){
    const courses={};
    (rows||[]).forEach(r=>{
      const c=r.course||'course'; const u=r.unit||'unit'; const l=String(r.lesson==null?'':r.lesson);
      courses[c]=courses[c]||{key:c,units:{},order:[]};
      const C=courses[c];
      if(!C.units[u]){ C.units[u]={key:u,lessons:{},order:[]}; C.order.push(u); }
      const U=C.units[u];
      if(!U.lessons[l]){ U.lessons[l]={key:l,acts:{}}; U.order.push(l); }
      // points_earned and points_possible come straight from the API. They are
      // null when the column has no authored denominator, and that null is
      // carried rather than filled in.
      let possible=(r.points_possible!=null)?r.points_possible:this.possibleFor(u,l,r.activity_type);
      let earned=(r.points_earned!=null)?r.points_earned
        :((possible!=null&&r.score!=null)?Math.round(r.score/100*possible*100)/100:null);
      let src=r.denominator_source||null;
      // No authored total means the points are UNKNOWN, and unknown is what is
      // shown. An earlier version filled the gap with a provisional 100. The
      // percentage stayed right, but the weight was fiction: a column priced at
      // 100 outweighs a real 5 mark quiz twenty to one, and it produced course
      // totals whose denominator appears on no page. The cell keeps its percent
      // and is marked, so the missing total is visible rather than papered over.
      if(possible==null&&r.score!=null){ earned=null; src='percent'; }
      U.lessons[l].acts[r.activity_type]={
        completed:!!r.completed,
        score:(r.score==null?null:r.score),
        attempts:(r.attempts==null?null:r.attempts),
        earned:earned, possible:possible, source:src
      };
    });
    return courses;
  },

  cmpLesson(a,b){
    const pa=String(a).split('.').map(n=>parseInt(n,10)), pb=String(b).split('.').map(n=>parseInt(n,10));
    const na=pa.every(x=>!isNaN(x)), nb=pb.every(x=>!isNaN(x));
    if(na&&nb){ for(let i=0;i<Math.max(pa.length,pb.length);i++){ const d=(pa[i]||0)-(pb[i]||0); if(d)return d; } return 0; }
    if(na)return -1; if(nb)return 1; return String(a).localeCompare(String(b));
  },
  clsFor(p){ if(p==null)return'n'; if(p>=this.threshold)return'g'; if(p>=60)return'a'; return'r'; },
  lessonLabel(l){ const s=String(l); if(/^\d/.test(s))return s; return s.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); },
  num(n){ return (Math.round(n*100)/100).toString(); },

  // A cell shows points earned over points possible. With no authored
  // denominator it shows the percent alone, which is the honest answer, rather
  // than a fraction against a number nobody chose.
  cellHtml(nm,a,c){ const S=this;
    if(c&&c.score!=null){
      const att=(c.attempts&&c.attempts>1)?("<span class='sp-att'>"+c.attempts+"x</span>"):"";
      // Points earned over points possible whenever the points are known. Where
      // nobody has assigned points to the activity yet, the percent is shown on
      // its own and marked, rather than invented against a denominator that
      // appears on no page.
      const prov=(c.possible==null||c.earned==null);
      const text=prov
        ? S.num(c.score)+"%<span class='sp-prov' title='Points not assigned to this activity yet'>*</span>"
        : S.num(c.earned)+"/"+S.num(c.possible);
      const label=prov
        ? S.num(c.score)+" percent, points not assigned to this activity yet"
        : S.num(c.earned)+" of "+S.num(c.possible)+" points";
      return "<span class='sp-cell "+S.clsFor(c.score)+"' aria-label='"+S.esc(nm)+": "+label
        +((c.attempts&&c.attempts>1)?(", "+c.attempts+" attempts"):"")+"'>"+text+att+"</span>";
    }
    if(c&&c.completed){ return "<span class='sp-cell c' aria-label='"+S.esc(nm)+": completed, not graded'>✓</span>"; }
    return "<span class='n' aria-label='"+S.esc(nm)+": not started'>–</span>";
  },

  unitLabel(k){ let m; if(m=/^unit-(\d+)$/.exec(k))return 'Unit '+m[1]; if(m=/^bi-?(\d+)$/.exec(k))return 'Big Idea '+m[1]; if(k==='qotd')return 'Daily Practice'; if(k==='exams')return 'Practice Exams'; return k.replace(/(^|[-_])(\w)/g,(x,s,c)=>(s?' ':'')+c.toUpperCase()); },
  formatCourse(c){ return {'ap-cybersecurity':'AP Cybersecurity','ap-csa':'AP CSA','ap-csp':'AP CSP','ap-networking':'AP Networking'}[c]||c||''; },

  allActivityCells(){
    const cells=[]; const cs=this.model;
    Object.keys(cs).forEach(ck=>{ const C=cs[ck]; C.order.forEach(uk=>{ const U=C.units[uk];
      U.order.forEach(lk=>{ const L=U.lessons[lk]; Object.keys(L.acts).forEach(a=>{ cells.push(L.acts[a]); }); }); }); });
    return cells;
  },

  // Points over points, never a mean of percentages. A mean lets a 5 point quiz
  // count the same as a 25 point exam, and it moves a student's grade every time
  // they start something new.
  totals(cells){
    let earned=0,graded=0,priced=0,unpriced=0;
    (cells||[]).forEach(c=>{
      if(c.score==null) return;
      if(c.possible!=null&&c.earned!=null&&c.possible>0){ earned+=c.earned; graded+=c.possible; }
      if(c.source==='percent') unpriced++; else priced++;
    });
    return { earned:Math.round(earned*100)/100, graded:Math.round(graded*100)/100,
             pct: graded>0?Math.round(earned/graded*1000)/10:null, priced:priced, unpriced:unpriced };
  },

  renderStats(){
    const cells=this.allActivityCells();
    const scored=cells.filter(x=>x.score!=null);
    const started=cells.filter(x=>x.score!=null||x.completed);
    const t=this.totals(cells);
    const mastered=scored.filter(x=>x.score>=this.threshold).length;
    const has=t.pct!=null;
    const card=(l,v,f)=>'<div class="sp-stat"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="f">'+f+'</div></div>';
    document.getElementById('sp-stats').innerHTML=
      card('Overall',has?(t.pct+'<small>%</small>'):'–',has?(this.letter(t.pct)+', points earned over points attempted'):'no graded points yet')+
      card('Points',has?(this.num(t.earned)+'<small> / '+this.num(t.graded)+'</small>'):'–','of the work you have attempted')+
      card('Activities done',started.length,'started or submitted')+
      card('Mastered',scored.length?(mastered+'<small>/'+scored.length+'</small>'):'–','at '+this.threshold+'% or above');
  },
  letter(p){ if(p>=90)return'A'; if(p>=80)return'B'; if(p>=70)return'C'; if(p>=60)return'D'; return'F'; },

  renderUnits(){
    const cs=this.model; let html=''; const S=this; const ckeys=Object.keys(cs);
    ckeys.forEach(ck=>{ const C=cs[ck];
      html+="<h2 class='sp-course-h'>"+S.esc(S.formatCourse(ck)||ck)+"</h2>";
      C.order.forEach(uk=>{ const U=C.units[uk];
        const ucells=[]; U.order.forEach(lk=>Object.keys(U.lessons[lk].acts).forEach(a=>ucells.push(U.lessons[lk].acts[a])));
        const ut=S.totals(ucells);
        html+="<section class='sp-unit'><div class='sp-unit-head'><h2>"+S.esc(S.unitLabel(uk))+"</h2><span class='sp-unit-pct'>"+(ut.pct==null?'Not graded':ut.pct+'%')+"<span class='sp-unit-bar'><i style='width:"+(ut.pct||0)+"%'></i></span></span></div>";
        const lessons=U.order.slice().sort((a,b)=>S.cmpLesson(a,b));
        const standard=lessons.filter(l=>Object.keys(U.lessons[l].acts).some(a=>ACTS.indexOf(a)>-1));
        const singles=lessons.filter(l=>standard.indexOf(l)<0);
        if(standard.length){
          // No "/N" in the header. Denominators differ per lesson (Cyber 1.1
          // Exercise 1 is out of 7, Unit 2's is out of 6), so a single number
          // above the column is wrong for most of it. Each cell carries its own.
          html+="<table class='sp-table'><thead><tr><th class='lname' scope='col'>Lesson</th>";
          ACTS.forEach(a=>{ html+="<th scope='col'>"+ACT_LABEL[a]+"</th>"; });
          html+="<th scope='col'>Lesson</th></tr></thead><tbody>";
          standard.forEach(lk=>{ const L=U.lessons[lk]; const nm=S.lessonLabel(lk);
            html+="<tr><td class='lname'>"+S.esc(nm)+"</td>";
            const lcells=[];
            ACTS.forEach(a=>{ const c=L.acts[a]; if(c) lcells.push(c); html+="<td>"+S.cellHtml(nm+' '+ACT_LABEL[a],a,c)+"</td>"; });
            const lt=S.totals(lcells);
            html+="<td class='lpct'>"+(lt.pct==null?"<span class='n'>–</span>":(S.num(lt.earned)+"/"+S.num(lt.graded)))+"</td></tr>";
          });
          html+="</tbody></table>";
        }
        if(singles.length){
          html+="<div class='sp-srows'>";
          singles.forEach(lk=>{ const L=U.lessons[lk]; const a=Object.keys(L.acts)[0]; const c=L.acts[a];
            const nm=(lk==='exam'||lk==='case-file')?(ACT_LABEL[lk]||(S.unitLabel(uk)+' '+lk)):S.lessonLabel(lk);
            html+="<div class='sp-srow'><span class='lname'>"+S.esc(nm)+"</span>"+S.cellHtml(nm,a,c)+"</div>";
          });
          html+="</div>";
        }
        html+="</section>";
      });
    });
    if(!html) html="<div class='sp-note'>No progress yet. Start a lesson and your scores will show up here.</div>";
    const anyScore=this.allActivityCells().some(x=>x.score!=null);
    if(!anyScore && html.indexOf('sp-note')<0){ html="<div class='sp-info'>These are lessons you have opened. Individual grades appear here as you complete the graded quizzes and exercises in each lesson.</div>"+html; }
    document.getElementById('sp-units').innerHTML=html;
    const pn=document.getElementById('sp-pass');
    if(pn){
      const t=this.totals(this.allActivityCells());
      let note="Passing mark: <b>"+this.threshold+"%</b>. Each score is points earned out of points possible. A blue check means completed but not yet graded.";
      // What the total actually does with those activities. It used to say they
      // "count out of 100 until then", which was the old behaviour and is no
      // longer true: an unpriced activity is left out of the points total
      // entirely, on both sides. Saying otherwise told a student their grade was
      // computed one way while it was computed another.
      if(t.unpriced) note+=" A * marks "+t.unpriced+" activit"+(t.unpriced===1?"y whose":"ies whose")+" points have not been assigned yet. "+(t.unpriced===1?"Its percent is shown, and it is":"Their percents are shown, and they are")+" not counted in the points total.";
      pn.innerHTML=note;
    }
  },

  logout(){ localStorage.removeItem('apcse_token'); localStorage.removeItem('apcse_student');
    document.getElementById('sp-main').classList.add('sp-hidden'); document.getElementById('sp-auth').classList.remove('sp-hidden'); },
  esc(s){ var A='&'; return String(s==null?'':s).split(A).join(A+'amp;').split('<').join(A+'lt;').split('>').join(A+'gt;').split('"').join(A+'quot;'); }
};
document.addEventListener('DOMContentLoaded',()=>StProg.init());
})();
</script>

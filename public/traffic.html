<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>APCSExamPrep · Traffic</title>
<style>
  :root {
    color-scheme: light dark;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --good:#0ca30c; --critical:#d03b3b;
    --ga4:#2a78d6; --gsc:#1baf7a; --raptive:#eda100; --clarity:#8b5cf6;
    --shadow:0 1px 2px rgba(11,11,11,0.04),0 1px 3px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --critical:#e66767; --ga4:#3987e5; --gsc:#199e70; --raptive:#c98500; --clarity:#a78bfa; --shadow:none;
    }
  }
  :root[data-theme="dark"]{--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink-2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--baseline:#383835;--border:rgba(255,255,255,0.10);--critical:#e66767;--ga4:#3987e5;--gsc:#199e70;--raptive:#c98500;--clarity:#a78bfa;--shadow:none;}
  :root[data-theme="light"]{--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--grid:#e1e0d9;--baseline:#c3c2b7;--border:rgba(11,11,11,0.10);--critical:#d03b3b;--ga4:#2a78d6;--gsc:#1baf7a;--raptive:#eda100;--clarity:#8b5cf6;--shadow:0 1px 2px rgba(11,11,11,0.04),0 1px 3px rgba(11,11,11,0.06);}

  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--plane); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--ga4); }
  .wrap { max-width:1680px; margin:0 auto; padding:16px 18px 56px; }

  header.top { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  header.top h1 { font-size:19px; margin:0; font-weight:650; letter-spacing:-0.01em; }
  header.top .sub { color:var(--muted); font-size:12.5px; }
  header.top .spacer { flex:1 1 auto; }
  .navlink { color:var(--ga4); text-decoration:none; font-size:12.5px; font-weight:600; }
  button { font:inherit; font-size:12.5px; color:var(--ink); background:transparent; border:1px solid var(--border); border-radius:7px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--baseline); }
  button.on { border-color:var(--ga4); color:var(--ga4); font-weight:600; }

  /* ── Section bands ────────────────────────────────────────────────────── */
  .band { margin:22px 0 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--border); }
  .band:first-of-type { margin-top:6px; padding-top:0; border-top:none; }
  .band h2 { font-size:13px; font-weight:700; margin:0; letter-spacing:0.02em; text-transform:uppercase; }
  .band .note { font-size:12px; color:var(--muted); font-weight:400; }
  .dot { width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* ── Metric card grid: every metric, always visible ───────────────────── */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:10px; }
  .m { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 12px 8px; box-shadow:var(--shadow); }
  .m .hd { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .m .name { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; }
  .m .src { font-size:10px; color:var(--muted); }
  .m .val { font-size:25px; font-weight:650; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; margin:2px 0 0; line-height:1.15; }
  .m .spark { margin:6px 0 4px; }
  .m .wins { display:flex; gap:10px; border-top:1px solid var(--grid); padding-top:6px; }
  .m .w { flex:1 1 0; min-width:0; }
  .m .w .wl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .m .w .wv { font-size:12.5px; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .up { color:var(--good); } .down { color:var(--critical); } .flat { color:var(--muted); }
  .partial { color:var(--muted); font-weight:400; }

  /* ── Cards + tables ──────────────────────────────────────────────────── */
  .cols { display:grid; gap:12px; align-items:start; }
  .c2 { grid-template-columns:1fr 1fr; }
  .c3 { grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:1180px){ .c3 { grid-template-columns:1fr 1fr; } }
  @media (max-width:820px){ .c2,.c3 { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); }
  .card h3 { margin:0 0 1px; font-size:13px; font-weight:650; }
  .card .hint { color:var(--muted); font-size:11.5px; margin:0 0 9px; }

  table.t { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.t th { text-align:left; font-weight:600; color:var(--muted); padding:4px 6px; border-bottom:1px solid var(--border); white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  table.t th.n { text-align:right; }
  table.t td { padding:5px 6px; border-bottom:1px solid var(--grid); white-space:nowrap; }
  table.t td.n { text-align:right; font-variant-numeric:tabular-nums; }
  table.t tr:last-child td { border-bottom:none; }
  .scroll { overflow-x:auto; }
  .lz { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
  .trunc { display:inline-block; max-width:280px; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  svg text { font:10px system-ui,sans-serif; fill:var(--muted); }
  .empty { padding:18px; text-align:center; color:var(--muted); font-size:12px; }
  .banner { border-radius:9px; padding:9px 12px; font-size:12.5px; margin-bottom:12px; border:1px solid; }
  .banner.warn { background:color-mix(in srgb,var(--raptive) 12%,transparent); border-color:color-mix(in srgb,var(--raptive) 30%,transparent); color:var(--ink-2); }
  .banner.bad { background:color-mix(in srgb,var(--critical) 10%,transparent); border-color:color-mix(in srgb,var(--critical) 35%,transparent); color:var(--ink-2); }
  .foot { font-size:11.5px; color:var(--muted); margin-top:10px; }
</style>
<!-- Product analytics. Inert unless POSTHOG_API_KEY is set on the server. -->
<script src="/posthog-init.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Traffic</h1>
    <span class="sub" id="sub">loading…</span>
    <a class="navlink" href="/admin/unified">Unified →</a>
    <a class="navlink" href="/admin/dashboard">Dashboard →</a>
    <span class="spacer"></span>
    <span id="ranges"></span>
    <button id="refreshBtn">Refresh</button>
  </header>

  <div id="banners"></div>
  <div id="sections"></div>
  <p class="foot" id="prov"></p>
</div>

<script>
(function () {
  "use strict";

  // Metrics are grouped by the source that reports them, so a source that has
  // no data simply does not draw a section. Nothing to select, nothing to get
  // wrong: the old dropdown let you ask Search Console for pageviews and get a
  // blank chart with no explanation.
  var SOURCES = [
    { key:"ga4",     label:"Audience",  sub:"Google Analytics 4", css:"var(--ga4)" },
    { key:"gsc",     label:"Search",    sub:"Search Console",     css:"var(--gsc)" },
    { key:"raptive", label:"Revenue",   sub:"Raptive",            css:"var(--raptive)" },
    { key:"clarity", label:"Behaviour", sub:"Clarity",            css:"var(--clarity)" }
  ];
  var RANGES = [[30,"30d"],[90,"90d"],[180,"180d"],[365,"1y"]];
  var RATIO = { engagement_rate:1, bounce_rate:1, ctr:1, scroll_depth:1 };
  var MONEY = { revenue:1, rpm:1 };

  var state = { days:90, data:null };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c];
    });
  };

  function fmt(v, metric) {
    if (v == null) return "-";
    if (RATIO[metric]) return (v * 100).toFixed(1) + "%";
    if (MONEY[metric]) return "$" + Number(v).toLocaleString(undefined,{maximumFractionDigits: v < 100 ? 2 : 0});
    if (metric === "position") return Number(v).toFixed(1);
    if (metric === "avg_engagement_seconds") return Math.round(v) + "s";
    return Number(v).toLocaleString(undefined,{maximumFractionDigits: Math.abs(v) < 10 ? 1 : 0});
  }
  // One direction rule for the whole page. `lower_is_better` comes from the
  // server so the page cannot disagree with the analysis about what "up" means.
  function dirClass(lowerBetter, delta) {
    if (delta == null || delta === 0) return "flat";
    return (lowerBetter ? delta < 0 : delta > 0) ? "up" : "down";
  }

  function api(path) {
    return fetch(path, { credentials:"same-origin" }).then(function (r) {
      if (r.status === 401 || r.status === 403 || r.status === 503) { var e = new Error("auth"); e.auth = true; throw e; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function load() {
    return api("/api/admin/traffic?days=" + state.days).then(function (d) { state.data = d; render(); });
  }

  // ── Sparkline: gaps break the line rather than being drawn through ──────
  function spark(points, color, lowerBetter) {
    var vals = points.map(function (p) { return p.value; }).filter(function (v) { return v != null; });
    if (vals.length < 2) return '<div style="height:34px"></div>';
    var W = 260, H = 34;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (lo === hi) { lo -= 1; hi += 1; }
    var n = points.length;
    var x = function (i) { return (i / (n - 1)) * W; };
    // A rank axis is inverted: position 1 belongs at the top.
    var y = function (v) { var t = (v - lo) / (hi - lo); return lowerBetter ? t * H : (1 - t) * H; };
    var d = "", open = false;
    points.forEach(function (p, i) {
      if (p.value == null) { open = false; return; }
      d += (open ? "L" : "M") + x(i).toFixed(1) + " " + y(p.value).toFixed(1) + " ";
      open = true;
    });
    var lastIdx = -1;
    for (var i = points.length - 1; i >= 0; i--) { if (points[i].value != null) { lastIdx = i; break; } }
    var dot = lastIdx >= 0
      ? '<circle cx="' + x(lastIdx).toFixed(1) + '" cy="' + y(points[lastIdx].value).toFixed(1) + '" r="2" fill="' + color + '"/>'
      : "";
    return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:34px">' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/>' + dot + "</svg>";
  }

  // ── Full chart with axis, used for the headline series of each source ───
  function chart(points, color, lowerBetter, metric, trend) {
    var vals = points.map(function (p) { return p.value; }).filter(function (v) { return v != null; });
    if (!vals.length) return '<div class="empty">No data.</div>';
    var W = 760, H = 150, padL = 46, padR = 6, padT = 8, padB = 18;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (lo === hi) { lo -= 1; hi += 1; }
    var pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    if (!RATIO[metric] && !lowerBetter && lo < 0) lo = 0;
    var n = points.length;
    var x = function (i) { return padL + (i / Math.max(1, n - 1)) * (W - padL - padR); };
    var y = function (v) { var t = (v - lo) / (hi - lo); return lowerBetter ? padT + t * (H - padT - padB) : padT + (1 - t) * (H - padT - padB); };

    var g = "";
    for (var k = 0; k <= 3; k++) {
      var v = lo + (hi - lo) * (k / 3), yy = y(v);
      g += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yy.toFixed(1) + '" stroke="var(--grid)"/>' +
           '<text x="' + (padL - 5) + '" y="' + (yy + 3).toFixed(1) + '" text-anchor="end">' + esc(fmt(v, metric)) + "</text>";
    }
    var line = function (series) {
      var d = "", open = false;
      series.forEach(function (p, i) {
        if (p.value == null) { open = false; return; }
        d += (open ? "L" : "M") + x(i).toFixed(1) + " " + y(p.value).toFixed(1) + " ";
        open = true;
      });
      return d;
    };
    var d = line(points);
    var dTrend = trend && trend.length ? line(trend) : "";
    var lab = "";
    if (n > 1) {
      [0, Math.floor(n / 2), n - 1].forEach(function (i) {
        var pr = points[i].date.split("-");
        lab += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="' + (i === 0 ? "start" : i === n - 1 ? "end" : "middle") + '">' + (+pr[1]) + "/" + (+pr[2]) + "</text>";
      });
    }
    return '<svg viewBox="0 0 ' + W + " " + H + '">' + g +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.2" opacity="0.35"/>' +
      (dTrend ? '<path d="' + dTrend + '" fill="none" stroke="' + color + '" stroke-width="2.2"/>' : "") +
      lab + "</svg>" +
      '<div style="display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted)">' +
        '<span><i style="display:inline-block;width:12px;height:2px;background:' + color + ';opacity:.35;vertical-align:middle"></i> daily</span>' +
        (dTrend ? '<span><i style="display:inline-block;width:12px;height:3px;background:' + color + ';vertical-align:middle"></i> 7-day average</span>' : "") +
      "</div>";
  }

  function table(rows, cols, emptyMsg) {
    if (!rows || !rows.length) return '<div class="empty">' + esc(emptyMsg) + "</div>";
    return '<table class="t"><thead><tr>' +
      cols.map(function (c) { return "<th" + (c.n ? ' class="n"' : "") + ">" + esc(c.h) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr>" + cols.map(function (c) { return "<td" + (c.n ? ' class="n"' : "") + ">" + c.f(r) + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table>";
  }

  // ── One metric card: value, sparkline, and EVERY window at once ─────────
  function metricCard(m, color) {
    var wins = Object.keys(m.windows).map(function (k) {
      var w = m.windows[k];
      var cls = dirClass(m.lower_is_better, w.delta);
      var pct = w.delta_pct == null ? "-" : (w.delta_pct > 0 ? "+" : "") + w.delta_pct + "%";
      // A window without full coverage on both sides is marked, so a partial
      // comparison is never read as a real one.
      return '<div class="w"><div class="wl">' + w.window_days + 'd' + (w.complete ? "" : " *") + "</div>" +
        '<div class="wv ' + cls + '">' + pct + "</div></div>";
    }).join("");
    return '<div class="m">' +
      '<div class="hd"><span class="name">' + esc(m.label) + '</span><span class="src">' + esc(m.source) + "</span></div>" +
      '<div class="val">' + fmt(m.latest, m.metric) + "</div>" +
      '<div class="spark">' + spark(m.trend && m.trend.length ? m.trend : m.series, color, m.lower_is_better) + "</div>" +
      '<div class="wins">' + wins + "</div>" +
      "</div>";
  }

  function renderBanners() {
    var d = state.data, out = "";
    var c = d.connectors || {};
    if (!c.service_account) {
      out += '<div class="banner warn"><b>Google connectors are not configured.</b> GA4 and Search Console will stay empty, which is not the same as zero traffic.</div>';
    }
    var stale = (d.inventory || []).filter(function (r) { return r.traffic_source && r.stale; });
    if (stale.length) {
      out += '<div class="banner bad"><b>' + stale.length + ' source(s) behind.</b> ' +
        stale.map(function (r) { return esc(r.source) + " last reported " + esc(r.last_date) + " (" + r.days_behind + "d ago)"; }).join(", ") + ".</div>";
    }
    $("banners").innerHTML = out;
  }

  function renderSections() {
    var ov = state.data.overview || { metrics: [] };
    var html = "";

    SOURCES.forEach(function (src) {
      var mine = ov.metrics.filter(function (m) { return m.source === src.key; });
      if (!mine.length) return;   // no data, no section, no empty chart to explain

      html += '<div class="band"><span class="dot" style="background:' + src.css + '"></span>' +
        "<h2>" + esc(src.label) + "</h2>" +
        '<span class="note">' + esc(src.sub) + " · " + mine.length + " metrics · " +
        mine[0].observed_days + " days of data</span></div>";

      html += '<div class="grid">' + mine.map(function (m) { return metricCard(m, src.css); }).join("") + "</div>";

      // Headline chart for the source: its first metric, full size.
      var head = mine[0];
      html += '<div class="card" style="margin-top:10px"><h3>' + esc(head.label) + " · daily</h3>" +
        '<p class="hint">Windows end yesterday: today is partial at every source and would draw a false cliff.</p>' +
        chart(head.series, src.css, head.lower_is_better, head.metric, head.trend) + "</div>";
    });

    $("sections").innerHTML = html + tablesHtml();
  }

  function tablesHtml() {
    var d = state.data;
    var pm = d.page_movers || {}, cm = d.click_movers || {}, rk = d.rankings || {};
    var moverCols = function (metric) { return [
      { h:"Page", f:function(r){ return '<span class="lz trunc" title="' + esc(r.value) + '">' + esc(r.value) + "</span>"; } },
      { h:"Now", n:true, f:function(r){ return fmt(r.current, metric); } },
      { h:"Was", n:true, f:function(r){ return fmt(r.previous, metric); } },
      { h:"Δ", n:true, f:function(r){ return '<span class="' + dirClass(false, r.delta) + '">' +
          (r.delta_pct == null ? fmt(r.delta, metric) : (r.delta_pct > 0 ? "+" : "") + r.delta_pct + "%") + "</span>"; } }
    ]; };
    var queryCols = [
      { h:"Query", f:function(r){ return '<span class="trunc" title="' + esc(r.value) + '">' + esc(r.value) + "</span>"; } },
      { h:"Now", n:true, f:function(r){ return fmt(r.current, "clicks"); } },
      { h:"Was", n:true, f:function(r){ return fmt(r.previous, "clicks"); } },
      { h:"Δ", n:true, f:function(r){ return '<span class="' + dirClass(false, r.delta) + '">' +
          (r.delta_pct == null ? fmt(r.delta,"clicks") : (r.delta_pct > 0 ? "+" : "") + r.delta_pct + "%") + "</span>"; } }
    ];

    var h = '<div class="band"><span class="dot" style="background:var(--ink-2)"></span><h2>Movement</h2>' +
      '<span class="note">' + (pm.window_days || 0) + "d vs the previous " + (pm.window_days || 0) +
      "d · pages under " + (pm.min_base || 0) + " views excluded, because a percentage on a tiny number says nothing</span></div>";

    h += '<div class="cols c2">' +
      '<div class="card"><h3>Pages gaining</h3><p class="hint">By pageviews.</p><div class="scroll">' +
        table((pm.winners||[]).slice(0,12), moverCols("pageviews"), "None yet.") + "</div></div>" +
      '<div class="card"><h3>Pages losing</h3><p class="hint">By pageviews.</p><div class="scroll">' +
        table((pm.losers||[]).slice(0,12), moverCols("pageviews"), "None yet.") + "</div></div>" +
      "</div>";

    h += '<div class="cols c2" style="margin-top:12px">' +
      '<div class="card"><h3>Queries gaining clicks</h3><p class="hint">Search Console.</p><div class="scroll">' +
        table((cm.winners||[]).slice(0,12), queryCols, "None yet.") + "</div></div>" +
      '<div class="card"><h3>Queries losing clicks</h3><p class="hint">Search Console.</p><div class="scroll">' +
        table((cm.losers||[]).slice(0,12), queryCols, "None yet.") + "</div></div>" +
      "</div>";

    h += '<div class="band"><span class="dot" style="background:var(--gsc)"></span><h2>Keyword rankings</h2>' +
      '<span class="note">' + (rk.tracked||0) + " queries · " + (rk.page_1||0) + " on page 1 · " +
      (rk.striking_distance||0) + " in striking distance (11-20) · sorted by clicks, because position alone surfaces one-impression long tail</span></div>";

    var rankCols = [
      { h:"Query", f:function(r){ return '<span class="trunc" title="' + esc(r.query) + '">' + esc(r.query) + "</span>"; } },
      { h:"Pos", n:true, f:function(r){ return r.position.toFixed(1); } },
      { h:"Move", n:true, f:function(r){ return r.delta == null ? '<span class="flat">new</span>'
          : '<span class="' + (r.delta < 0 ? "up" : r.delta > 0 ? "down" : "flat") + '">' + (r.delta>0?"+":"") + r.delta.toFixed(1) + "</span>"; } },
      { h:"Clicks", n:true, f:function(r){ return Number(r.clicks).toLocaleString(); } },
      { h:"Impr", n:true, f:function(r){ return Number(r.impressions).toLocaleString(); } }
    ];
    h += '<div class="cols c3">' +
      '<div class="card"><h3>Top queries</h3><p class="hint">By clicks earned.</p><div class="scroll">' +
        table((rk.top||[]).slice(0,14), rankCols, "No Search Console data yet.") + "</div></div>" +
      '<div class="card"><h3>Biggest rank gains</h3><p class="hint">Moved up the page.</p><div class="scroll">' +
        table((rk.biggest_gains||[]).slice(0,14), rankCols, "Not enough history yet.") + "</div></div>" +
      '<div class="card"><h3>Biggest rank drops</h3><p class="hint">Moved down.</p><div class="scroll">' +
        table((rk.biggest_drops||[]).slice(0,14), rankCols, "Not enough history yet.") + "</div></div>" +
      "</div>";

    h += '<div class="band"><span class="dot" style="background:var(--ink-2)"></span><h2>Source inventory</h2>' +
      '<span class="note">a source that stopped reporting shows up here as days behind, not as a chart that quietly flattens</span></div>';
    h += '<div class="card"><div class="scroll">' + table(state.data.inventory || [], [
      { h:"Source", f:function(r){ return esc(r.source); } },
      { h:"Metrics", n:true, f:function(r){ return r.metrics; } },
      { h:"Days", n:true, f:function(r){ return r.days; } },
      { h:"First", f:function(r){ return esc(r.first_date); } },
      { h:"Last", f:function(r){ return esc(r.last_date); } },
      { h:"Behind", n:true, f:function(r){ return r.days_behind == null ? "-" :
          '<span class="' + (r.stale ? "down" : "") + '">' + r.days_behind + "d</span>"; } }
    ], "Nothing has reported yet.") + "</div></div>";

    return h;
  }

  function renderRanges() {
    $("ranges").innerHTML = RANGES.map(function (r) {
      return '<button data-d="' + r[0] + '"' + (r[0] === state.days ? ' class="on"' : "") + ">" + esc(r[1]) + "</button>";
    }).join(" ");
    Array.prototype.forEach.call($("ranges").querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        state.days = parseInt(b.getAttribute("data-d"), 10);
        renderRanges(); load().catch(onErr);
      });
    });
  }

  function render() {
    if (!state.data) return;
    var n = (state.data.overview && state.data.overview.metrics.length) || 0;
    $("sub").textContent = n + " metrics across " + (state.data.inventory || []).filter(function (r) { return r.traffic_source; }).length + " sources";
    renderBanners(); renderSections();
    $("prov").textContent = "Generated " + new Date(state.data.generated_at).toLocaleString() +
      " · daily aggregates, 400-day retention · windows end yesterday · * marks a window without full coverage on both sides";
  }

  function onErr(e) {
    if (e && e.auth) { window.location.href = "/admin/traffic"; return; }
    $("banners").innerHTML = '<div class="banner bad">Error loading: ' + esc(e.message) + "</div>";
  }

  $("refreshBtn").addEventListener("click", function () { load().catch(onErr); });
  renderRanges();
  load().catch(onErr);
})();
</script>
</body>
</html>

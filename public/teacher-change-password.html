<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>APCSExamPrep · Change your password</title>
<style>
  :root {
    color-scheme: light dark;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e;
    --muted:#898781; --border:rgba(11,11,11,0.10); --csa:#2a78d6; --good:#0ca30c; --critical:#d03b3b;
    --shadow:0 1px 2px rgba(11,11,11,0.04),0 1px 3px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7;
      --muted:#898781; --border:rgba(255,255,255,0.10); --csa:#3987e5; --critical:#e66767; --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    background:var(--plane); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
  }
  .card {
    width:100%; max-width:420px; margin:12vh 20px 0; padding:28px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
  }
  h1 { margin:0 0 6px; font-size:18px; }
  p { margin:0 0 18px; color:var(--ink-2); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
  input, button, a.btn { font:inherit; width:100%; border-radius:8px; padding:10px 12px; }
  input { color:var(--ink); background:var(--plane); border:1px solid var(--border); margin-bottom:14px; }
  button { cursor:pointer; border:none; background:var(--csa); color:#fff; font-weight:600; }
  button:disabled { opacity:0.6; cursor:default; }
  a.btn { display:block; text-align:center; text-decoration:none; background:var(--csa); color:#fff; font-weight:600; }
  .msg { font-size:13px; min-height:18px; margin-top:12px; }
  .msg.err { color:var(--critical); }
  .msg.ok { color:var(--good); }
  .hint { font-size:12px; color:var(--muted); margin:-6px 0 14px; }
</style>
<!-- Product analytics. Inert unless POSTHOG_API_KEY is set on the server. -->
<script src="/posthog-init.js"></script>
</head>
<body>
  <form class="card" id="form">
    <h1>Change your password</h1>
    <p>Enter your current password, then choose a new one. You stay signed in.</p>
    <label for="cur">Current password</label>
    <input id="cur" type="password" autocomplete="current-password" autofocus />
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" />
    <div class="hint">At least 8 characters.</div>
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" />
    <button id="btn" type="submit">Change password</button>
    <div class="msg" id="msg"></div>
  </form>
<script>
(function () {
  "use strict";
  // The teacher JWT is whatever the dashboard already stores. Override via
  // window.APCS_TEACHER_TOKEN or adjust the keys below to match the theme.
  function token() {
    try {
      return window.APCS_TEACHER_TOKEN ||
        localStorage.getItem("apcs_teacher_token") ||
        localStorage.getItem("teacher_token") || "";
    } catch (e) { return ""; }
  }

  var form = document.getElementById("form");
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");

  if (!token()) {
    msg.className = "msg err";
    msg.textContent = "You are not signed in on this device. Sign in first, then come back to this page.";
    btn.disabled = true;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var cur = document.getElementById("cur").value;
    var pw = document.getElementById("pw").value;
    var pw2 = document.getElementById("pw2").value;
    if (!cur) { msg.className = "msg err"; msg.textContent = "Enter your current password."; return; }
    if (pw.length < 8) { msg.className = "msg err"; msg.textContent = "New password must be at least 8 characters."; return; }
    if (pw !== pw2) { msg.className = "msg err"; msg.textContent = "New passwords do not match."; return; }
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
    fetch("/api/teacher/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token() },
      body: JSON.stringify({ current_password: cur, new_password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok) {
          form.innerHTML = '<h1>Password changed</h1><p class="msg ok" style="margin-bottom:18px">' +
            (j.message || "Your password has been changed.") + "</p>";
        } else {
          msg.className = "msg err";
          msg.textContent = j.error || (r.status === 429 ? "Too many attempts. Wait a few minutes." : "Could not change your password.");
          btn.disabled = false;
        }
      });
    }).catch(function () {
      msg.className = "msg err"; msg.textContent = "Could not reach the server. Try again.";
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>

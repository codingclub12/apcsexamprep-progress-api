<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Help &middot; APCSExamPrep</title>
<meta name="description" content="How APCSExamPrep works: accounts, classes, quizzes, gradebooks and scores." />
<style>
  :root{color-scheme:light dark;--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;
    --muted:#898781;--border:rgba(11,11,11,0.10);--csa:#2a78d6;
    --shadow:0 1px 2px rgba(11,11,11,0.04),0 1px 3px rgba(11,11,11,0.06)}
  @media (prefers-color-scheme:dark){:root{--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink-2:#c3c2b7;
    --muted:#898781;--border:rgba(255,255,255,0.10);--csa:#3987e5;--shadow:none}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 16px 72px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--ink-2);margin:0 0 20px}
  .searchrow{display:flex;gap:8px}
  input{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface);color:var(--ink)}
  button{background:var(--csa);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  .res{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    padding:14px 16px;margin-top:12px}
  .res h2{font-size:17px;margin:0 0 4px}
  .res a{color:var(--csa);text-decoration:none}
  .res a:hover{text-decoration:underline}
  .ex{color:var(--ink-2);font-size:14px;margin:0}
  .cat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .empty{color:var(--ink-2);margin-top:18px}
  article{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-top:14px}
  article h2{margin-top:22px;font-size:19px}
  article pre{background:var(--plane);padding:10px;border-radius:8px;overflow-x:auto}
  article code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  .back{display:inline-block;margin-top:16px;color:var(--csa);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Help</h1>
  <p class="sub">How the site works. If you cannot find it here, use the report button on any page.</p>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Search, for example: quiz greyed out" aria-label="Search help" />
    <button id="go">Search</button>
  </div>
  <div id="out"></div>
</div>
<script src="/posthog-init.js"></script>
<script>
(function(){
  'use strict';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var out=document.getElementById('out'), q=document.getElementById('q');

  /* Minimal markdown, escaped first so an article can never inject markup.
     The KB is authored by an admin, but escaping is not conditional on trust. */
  function md(src){
    var h=esc(src);
    h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>');
    h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    h=h.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
    h=h.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
    return h.split(/\n{2,}/).map(function(p){
      return /^<(h2|h3|ul|blockquote)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
  }

  function results(d){
    if(!d.results||!d.results.length){
      out.innerHTML='<p class="empty">Nothing matched'+(d.query?' that':' yet')+
        '. Use the report button on the page you are stuck on and someone will look.</p>';
      return;
    }
    out.innerHTML=d.results.map(function(r){
      return '<div class="res"><div class="cat">'+esc(r.category||'help')+'</div>'+
        '<h2><a href="/help?a='+encodeURIComponent(r.slug)+'">'+esc(r.title)+'</a></h2>'+
        (r.excerpt?'<p class="ex">'+esc(r.excerpt)+'</p>':'')+'</div>';
    }).join('');
  }

  function search(term){
    fetch('/api/assistant/help?q='+encodeURIComponent(term||''))
      .then(function(r){return r.json();}).then(results)
      .catch(function(){out.innerHTML='<p class="empty">Search is unavailable right now.</p>';});
  }

  function article(slug){
    fetch('/api/assistant/help/'+encodeURIComponent(slug))
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d.article){out.innerHTML='<p class="empty">That article is not available.</p>';return;}
        document.title=d.article.title+' - Help - APCSExamPrep';
        out.innerHTML='<article><h1>'+esc(d.article.title)+'</h1>'+md(d.article.body_md)+
          '</article><a class="back" href="/help">Back to help</a>';
      })
      .catch(function(){out.innerHTML='<p class="empty">That article is not available.</p>';});
  }

  document.getElementById('go').addEventListener('click',function(){search(q.value);});
  q.addEventListener('keydown',function(e){if(e.key==='Enter')search(q.value);});

  var params=new URLSearchParams(location.search);
  if(params.get('a')) article(params.get('a'));
  else { q.value=params.get('q')||''; search(q.value); }
})();
</script>
</body>
</html>

name: Deploy drift

# WHAT THIS CATCHES
# A deploy that never landed. Railway builds on every push to main, but a failed
# or stalled build is invisible from outside: /api/health keeps answering 200
# from the last good container, so the site looks healthy while the merge you
# just made is not running anywhere.
#
# That happened on 2026-08-18. A merge at 05:15 UTC was still not serving at
# 09:13, four hours and six merges later, and the only reason anybody noticed
# was that somebody happened to compare two strings by hand.
#
# /api/health has reported which commit is serving since PR #191, precisely so
# this question could be answered. Nothing was asking it on a schedule. This
# does.
#
# WHY IT IS NOT JUST "deployed != main"
# Right after a merge they always differ, for as long as the build takes, and an
# alarm that fires on every healthy deploy is an alarm people turn off. So the
# check is time based.
#
# The subtlety, and the thing this got wrong on its first day: the clock has to
# run from the OLDEST undeployed commit, not from main's head. Head age resets on
# every merge, so on a busy repo it is almost always inside the grace window and
# the alarm can only fire when the repo is quiet, which is the opposite of what
# is wanted. See the long comment on stale_min below.

on:
  schedule:
    # Every 30 minutes. A stalled deploy is worth knowing about inside the hour,
    # and this job is a curl and some arithmetic.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Is main actually serving
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow slice. The ancestry check below asks
          # whether the SERVING commit is on main, and during a long stall that
          # commit can be many merges back. With a shallow clone the object is
          # simply absent, `--is-ancestor` errors, and the check would report
          # "not an ancestor" (a rollback) when the real answer is an ordinary
          # slow deploy. A monitor that gives the wrong diagnosis is worse than
          # one that gives none.
          fetch-depth: 0

      - name: Compare the serving commit against main
        id: compare
        env:
          HEALTH_URL: https://progress.apcsexamprep.com/api/health
          # How long a build is allowed to take before silence is a problem.
          GRACE_MINUTES: '30'
        run: |
          set -uo pipefail

          head_sha=$(git rev-parse HEAD)
          head_short=${head_sha:0:7}
          head_epoch=$(git log -1 --format=%ct "$head_sha")
          now_epoch=$(date -u +%s)
          age_min=$(( (now_epoch - head_epoch) / 60 ))

          # A transient blip must not read as a failed deploy, so the fetch gets
          # three tries before it is believed.
          body=""
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 20 "$HEALTH_URL" || true)
            [ -n "$body" ] && break
            sleep 10
          done

          if [ -z "$body" ]; then
            echo "::error title=Health endpoint unreachable::$HEALTH_URL did not answer after 3 tries."
            echo "That is a bigger problem than drift: the API may be down."
            echo "detail=/api/health did not answer after 3 tries; the API may be down. main is $head_short." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          served=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
          echo "main head : $head_short  (merged ${age_min}m ago)"
          echo "serving   : ${served:-<none>}"
          echo "grace     : ${GRACE_MINUTES}m"

          if [ -z "$served" ]; then
            echo "::error title=No commit in health response::/api/health answered but reported no commit."
            echo "Body: $body"
            echo "detail=/api/health answered but reported no commit at all. main is $head_short." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$served" = "unknown" ]; then
            echo "::error title=Serving container cannot name its own build::commit reported as 'unknown'."
            echo "None of the three sources in lib/build-commit.js resolved: the BUILD_COMMIT"
            echo "service variable, build-commit.txt inside the upload, and RAILWAY_GIT_COMMIT_SHA"
            echo "were all absent. A container that cannot name its build makes this check and"
            echo "railway-deploy.yml's confirm step blind, which is task 144."
            echo "detail=Serving container reports commit 'unknown', so it cannot name its own build. main is $head_short." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$served" = "$head_short" ]; then
            echo "In sync."
            echo "detail=In sync: production is serving $head_short." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Different, which is normal while a build runs. Classify BEFORE applying
          # any grace: grace is a statement about how long a build takes, and it
          # only makes sense when the serving commit is genuinely an older point on
          # main. A rollback or a foreign commit is not a slow build and must never
          # be waved through by a timer.
          #
          # "Not an ancestor" and "I have never heard of that commit" are
          # different findings and must not collapse into one message: the first
          # is a rollback, the second usually means the deploy predates this
          # clone or the sha is not from this repo at all.
          if ! git cat-file -e "${served}^{commit}" 2>/dev/null; then
            relation="a commit this repository does not contain, so it is not from main at all"
          elif git merge-base --is-ancestor "$served" "$head_sha" 2>/dev/null; then
            relation="behind"
          else
            relation="NOT AN ANCESTOR of main, which suggests a rollback or a deploy from another branch"
          fi

          # HOW LONG HAS THE DEPLOY ACTUALLY BEEN BEHIND?
          #
          # Not the age of main's head. That was the original bug and it made this
          # check useless in the exact situation it exists for. On 2026-08-18
          # production sat on one commit for over four hours while four merges
          # piled up behind it, and both scheduled runs reported success:
          #
          #     main head : e965049  (merged 13m ago)
          #     serving   : 26fe1e3
          #     Behind by design: main is only 13m old and a build takes a few minutes.
          #
          # Every merge reset the clock. On an active repo the head is almost
          # always younger than the grace window, so the alarm could only fire
          # during a quiet spell, never during a busy stall. Backwards.
          #
          # The honest clock starts when the deploy FIRST fell behind, and later
          # merges must not touch it: the age of the OLDEST commit that is not
          # deployed yet. --first-parent keeps this to commits as they landed on
          # main, so a branch whose commits were authored last week does not read
          # as a week-long outage the moment it merges.
          stale_min="$age_min"
          if [ "$relation" = "behind" ]; then
            first_undeployed=$(git rev-list --first-parent "${served}..${head_sha}" | tail -1)
            if [ -n "$first_undeployed" ]; then
              stale_min=$(( (now_epoch - $(git log -1 --format=%ct "$first_undeployed")) / 60 ))
              echo "undeployed since: $(git rev-parse --short "$first_undeployed") (${stale_min}m)"
            fi

            if [ "$stale_min" -le "${GRACE_MINUTES}" ]; then
              echo "Behind by design: the deploy has been behind for only ${stale_min}m and a build takes a few minutes."
              echo "detail=Building: serving $served, main is $head_short, behind ${stale_min}m and inside the ${GRACE_MINUTES}m grace." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "::error title=Deploy has not landed::production is serving $served ($relation) and has been behind for ${stale_min}m. main is $head_short, merged ${age_min}m ago."
          echo ""
          echo "A failed Railway build looks exactly like this from outside: /api/health"
          echo "keeps answering 200 from the last good container."
          echo ""
          echo "Check, in order:"
          echo "  1. Railway Deployments tab for a failed or stuck build."
          echo "  2. The build log for 'prebuild-install warn install Request timed out',"
          echo "     which is the documented failure mode for better-sqlite3 here."
          echo "  3. Whether the push that should have triggered it actually reached main."
          echo "detail=Deploy has not landed: serving $served ($relation), main is $head_short, behind ${stale_min}m." >> "$GITHUB_OUTPUT"
          exit 1

      # ── TELL THE BOARD ──────────────────────────────────────────────────────
      #  This check has been correct and unread. It went red on 2026-08-28 and
      #  stayed red for four days while the board's health panel reported
      #  `checks: {total: 1, failing: 0}`, because only tests.yml posted to
      #  /api/command/checks and this workflow reported to nobody. A human looks
      #  at the board, not at the Actions tab, so an alarm that only lands here
      #  manufactures the feeling of coverage without the coverage.
      #
      #  source `health` is the registered source for exactly this (see
      #  lib/command-checks.js), which files it in `now` on surface `api`.
      #  Fingerprinting is (source, check_id), so a stall that persists for days
      #  is ONE task aging rather than one per run, and going green auto-closes
      #  it with the passing run as the artifact.
      #
      #  NOT ON A CANCELLED JOB. tests.yml learned this the expensive way:
      #  `always()` fires on cancellation, job.status is then `cancelled`, and
      #  reporting `fail` from a run that compared nothing opened task #88
      #  against work that never happened. A cancelled run knows nothing, and
      #  silence is the only honest report.
      #
      #  continue-on-error, and the curl swallows its own failure: the command
      #  center is an observer here, and an observer that can turn this job red
      #  would make the drift alarm lie in a new direction.
      - name: Report the drift verdict to the command center
        if: always() && job.status != 'cancelled'
        continue-on-error: true
        env:
          TODO_KEY: ${{ secrets.TODO_KEY }}
          BASE: ${{ vars.PROGRESS_BASE_URL || 'https://progress.apcsexamprep.com' }}
          OUTCOME: ${{ steps.compare.outcome }}
          DETAIL: ${{ steps.compare.outputs.detail }}
        run: |
          if [ -z "${TODO_KEY:-}" ]; then
            echo "TODO_KEY not configured; skipping command center report."
            exit 0
          fi

          # Only success and failure can reach here; cancellation is filtered
          # above. Anything else is treated as a failure rather than guessed at.
          if [ "$OUTCOME" = "success" ]; then state=pass; else state=fail; fi

          # A verdict is always set by the step above, but never post an empty
          # detail: "" on the board reads as a check that ran and found nothing
          # to say, which is not the same as one that could not describe itself.
          detail="${DETAIL:-no verdict recorded by the compare step}"
          detail="$detail (run ${{ github.run_id }})"

          printf 'reporting state=%s detail=%s\n' "$state" "$detail"

          node -e '
            const body = JSON.stringify({
              source: "health",
              check_id: "deploy-drift",
              state: process.argv[1],
              detail: process.argv[2],
            });
            process.stdout.write(body);
          ' "$state" "$detail" > payload.json

          curl -sS -X POST "$BASE/api/command/checks" \
            -H "Authorization: Bearer $TODO_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; apcse-ci/1.0) Chrome/120.0.0.0 Safari/537.36" \
            --data-binary @payload.json \
            || echo "report failed, ignoring"

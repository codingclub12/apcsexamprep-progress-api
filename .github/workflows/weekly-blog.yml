# ─────────────────────────────────────────────────────────────────────────────
#  Publishes the week's course posts, one per course, and reports what is next.
#
#  The publish step is genuinely automatic: posts go live without review. What
#  makes that safe is that `blog.js publish` refuses the entire batch unless
#  every post in content/blog passes the gate in lib/blog-validate.js, so the
#  only thing this workflow can do wrong is publish nothing.
#
#  It does NOT write posts. Authoring is a session with a person or an agent in
#  it. What this does is publish what is already written and due, then print the
#  backlog so an empty queue is visible a week before it becomes an empty
#  Tuesday.
# ─────────────────────────────────────────────────────────────────────────────
name: weekly-blog

on:
  schedule:
    # Tuesdays 14:00 UTC, which is mid-morning US Central. Publishing into the
    # working day rather than overnight means a bad post is noticed in hours.
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and report without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs first and separately so a validation failure is reported as a
      # validation failure, not buried inside a publish that refused.
      - name: Validate every post
        run: node scripts/blog.js validate

      - name: Publish what is due
        if: ${{ !inputs.dry_run }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: node scripts/blog.js publish

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: node scripts/blog.js publish --dry-run

      # Always runs, including after a failed publish, because knowing the
      # backlog is empty matters most on the weeks something else went wrong.
      - name: Report the authoring backlog
        if: always()
        run: |
          echo "### Weekly blog queue" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/blog.js queue >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

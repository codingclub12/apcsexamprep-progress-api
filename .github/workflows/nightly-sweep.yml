name: Overnight board sweep

# Phase 2.2. Runs the verifier over needs_verification while nobody is awake and
# reports WHAT CHANGED since the last sweep.
#
# WHY A DELTA AND NOT THE REPORT
#   A job that reprints the same fourteen tasks every morning is wallpaper
#   inside a week, and an unread green tick is the exact failure this system
#   exists to catch. "Nothing changed" is one line and is the honest answer most
#   mornings. Anything else is worth reading.
#
# IT STILL WRITES NOTHING. It does not file findings as tasks, it does not
# dispatch, and it cannot set `verified` - that path is cookie-auth only, so the
# thing that did the work is never the thing that closes the loop on it. This is
# deliberately narrower than "the overnight sweep that files findings as tasks":
# reading unattended and writing unattended are different risks, and only the
# first one is being taken tonight.
#
# --redact is not optional here for the same reason it is not optional in
# verify-board.yml: this repo is public and so is this log.

on:
  schedule:
    # 08:00 UTC, which is 03:00 US Central. Chosen to sit clear of the two jobs
    # already on the clock: auto-dispatch at 06:00 and the browser smoke test at
    # 07:00. Stacking them would drive the storefront three times in an hour and
    # trip its bot protection, which is the same mistake smoke.yml documents.
    #
    # schedule only fires from the DEFAULT BRANCH, so nothing runs from a
    # feature branch and this line does nothing until it is merged.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many tasks to check this run (the storefront rate-limits)'
        required: false
        default: '12'

# Shares a group with verify-board.yml ON PURPOSE. Concurrency groups are
# matched by name across workflows, so a nightly sweep and a hand-pressed
# reconcile can never hit the storefront at the same time.
concurrency:
  group: verify-board
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: What changed on the board
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The previous sweep's state. A miss is normal on the first run and after
      # a week of inactivity, and board-delta.js reports "no baseline" rather
      # than treating every task as new - a false alarm on the one morning with
      # nothing to compare against would teach someone to ignore mornings.
      - name: Restore the last sweep's state
        uses: actions/cache/restore@v4
        with:
          path: previous.json
          key: board-state-${{ github.run_id }}
          restore-keys: |
            board-state-

      - name: Sweep the board
        env:
          TODO_KEY: ${{ secrets.TODO_KEY }}
          APCS_BASE: ${{ vars.PROGRESS_BASE_URL || 'https://progress.apcsexamprep.com' }}
          LIMIT: ${{ inputs.limit || '12' }}
        run: |
          # pipefail everywhere a pipeline carries a real exit status. Without
          # it `node ... | tee` reports TEE's status and a dead script lands as
          # a green tick, which is how this workflow's sibling shipped broken.
          set -o pipefail

          # A missing secret is a FAILURE, not a skip. A green tick on a night
          # that read nothing is worse than no run at all, because every morning
          # then looks identical whether it worked or not.
          if [ -z "$TODO_KEY" ]; then
            {
              echo "### Overnight board sweep: NOT CONFIGURED"
              echo ""
              echo "No \`TODO_KEY\` secret is set, so the board was never read."
              echo ""
              echo "Add it in Settings > Secrets and variables > Actions. It must match the"
              echo "\`TODO_KEY\` the API runs with on Railway, character for character, or the"
              echo "read comes back 401."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=TODO_KEY not configured::The sweep cannot read the board without it."
            exit 1
          fi

          if ! node scripts/verify-board.js --redact --json --limit "$LIMIT" > current.json; then
            {
              echo "### Overnight board sweep: FAILED"
              echo ""
              echo "The verifier could not read the board. Nothing was compared."
              echo '```'
              head -c 2000 current.json 2>/dev/null || echo "(no output)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Sweep failed::The board could not be read. See the job log."
            exit 1
          fi

          # A 0-byte or unparseable report must not become a quiet morning. The
          # delta script exits 1 on an unreadable CURRENT report for this reason;
          # this check just makes the message specific.
          if ! node -e 'JSON.parse(require("fs").readFileSync("current.json","utf8"))'; then
            echo "::error title=Unreadable report::verify-board produced output that is not JSON."
            exit 1
          fi

          if [ -f previous.json ]; then
            node scripts/board-delta.js previous.json current.json | tee delta.md
          else
            node scripts/board-delta.js --none current.json | tee delta.md
          fi
          cat delta.md >> "$GITHUB_STEP_SUMMARY"

      - name: Say what happens next
        if: success()
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "**Nothing here was written to the ledger.** This sweep reads. To close"
            echo "anything, open the board and click verify: that path is cookie-auth only,"
            echo "which is the whole reason the number means anything."
            echo ""
            echo "The full report, not just the diff, is one manual run away:"
            echo "**Actions > Reconcile the board > Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Cached under the SAME FILENAME the restore step expects. actions/cache
      # restores a file to the path it was saved from, so caching current.json
      # would restore current.json - previous.json would never exist, every
      # morning would report "no baseline", and the run would be GREEN every
      # single night while comparing nothing. Caught before shipping; it is the
      # same shape as the tee bug and the duplicated severity rule.
      #
      # Saved only on success, so a failed night cannot poison the baseline and
      # make the next morning report phantom changes against a half-written file.
      - name: Save this sweep's state
        if: success()
        run: cp current.json previous.json

      - uses: actions/cache/save@v4
        if: success()
        with:
          path: previous.json
          key: board-state-${{ github.run_id }}

      # ── CAN GRADED WORK STILL REACH THE GRADEBOOK? ──────────────────────────
      #
      # Added after the 2026-08-21 teacher report, where three defects had made
      # every graded cyber exercise and lab page record nothing, and the only
      # thing that surfaced it was an email. All three were silent: nothing
      # threw, nothing logged, and the board looked fine every morning.
      #
      # DELIBERATELY LAST, AND AFTER THE CACHE SAVE. This step can fail the job,
      # and the two save steps above are `if: success()`. Running it earlier
      # would mean a broken grade path ALSO skips the baseline save, so the next
      # morning reports "no baseline" and someone learns to ignore mornings.
      # That is the exact failure the restore step's comment warns about, so the
      # order here is load-bearing rather than incidental.
      #
      # ~10 requests against the storefront, not the 250 a full page crawl would
      # take. The contract it checks lives in the deployed assets, and smoke.yml
      # already records what driving the storefront hard does to bot protection.
      #
      # It reads. Nothing here is recorded to the ledger, the same posture as the
      # rest of this workflow.
      #
      # The wording above is deliberate. smoke/board-delta.js asserts that the
      # literal string "w-r-i-t-e" appears nowhere in this file, so a permissions
      # block granting more than read can never slip in unnoticed. It is a blunt
      # test over the whole file rather than over the permissions block, so even
      # a comment trips it, and spelling the word out here would too. If a future
      # edit fails that assertion, reword the comment. Do not loosen the check to
      # fit the prose: it is guarding the difference between a job that reads
      # unattended and one that changes things unattended.
      # ── IS THE SITE USABLE RIGHT NOW? ──────────────────────────────────────
      #
      # Added 2026-08-25, after progress.apcsexamprep.com went down and took the
      # practice pages with it. The pages never 404ed. They served HTTP 200,
      # rendered their heading and prose, and sat on a loading message forever,
      # because their content arrives from the API at render time. A check that
      # asked for a status code would have been green for the whole outage, and
      # the only thing that surfaced it was a person opening a page.
      #
      # So this asks the endpoint each page actually mounts from. /api/health can
      # be perfectly happy while /api/frq is broken by one bad spec.
      #
      # Same posture as the step below: it reads, and it is placed after the two
      # cache saves so that a failure here can never also skip the baseline and
      # leave the next morning reporting "no baseline".
      #
      # ~12 requests, single threaded with a pause. Board item #79 records 46
      # pages returning 429 during a parallel crawl of this storefront.
      - name: Is the site usable right now
        if: always()
        run: |
          set -o pipefail
          if node scripts/page-availability.js | tee availability.txt; then
            {
              echo ""
              echo "**Availability:** every page a class needs, and the endpoint each one mounts from, is answering."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "### Something a class needs is not answering"
              echo ""
              echo "A page here can be returning HTTP 200 and still be unusable: most content"
              echo "pages are a mount point that fetches from the API at render time, so an API"
              echo "outage shows up as a page that loads forever rather than as an error."
              echo ""
              echo '```'
              cat availability.txt
              echo '```'
              echo ""
              echo "Reproduce with \`node scripts/page-availability.js\`. What each failure means,"
              echo "and what to do about it, is in \`docs/availability.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Something a class needs is not answering::See the summary."
            exit 1
          fi

      - name: Can graded work still reach the gradebook
        if: always()
        run: |
          set -o pipefail
          if node scripts/grade-path-audit.js | tee grade-path.txt; then
            {
              echo ""
              echo "**Grade path:** every reporter loads, and every function they hand results to exists."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "### Graded work is NOT reaching the gradebook"
              echo ""
              echo "Students are submitting work that is not being recorded, or is being"
              echo "recorded wrongly. This is silent to them and to their teacher."
              echo ""
              echo '```'
              cat grade-path.txt
              echo '```'
              echo ""
              echo "Reproduce with \`node scripts/grade-path-audit.js\`. The rules are pinned"
              echo "offline by \`npm run smoke:gradepath\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Graded work is not reaching the gradebook::See the summary."
            exit 1
          fi

      # ── TELL THE BOARD ──────────────────────────────────────────────────────
      #  Board task 166: same reporting gap as deploy-drift.yml before
      #  2026-09-01. This job carries three real failure points above (the board
      #  read, page-availability, grade-path-audit); job.status here is
      #  `failure` if ANY of them tripped, because none of those steps has
      #  continue-on-error, and this step's own `if: always()` is what keeps it
      #  running to say so.
      #
      #  Placed last, after both `if: success()` cache-save steps earlier in this
      #  file: this step touches none of the state those steps persist, so its
      #  position cannot poison a baseline the way running the availability and
      #  grade-path checks before the cache save would have (see the comment on
      #  the restore step above).
      #
      #  continue-on-error so the observer cannot turn this red by itself; never
      #  on a cancelled run, which checked nothing; a missing TODO_KEY skips
      #  rather than fails.
      - name: Report to the command center
        if: always() && job.status != 'cancelled'
        continue-on-error: true
        env:
          TODO_KEY: ${{ secrets.TODO_KEY }}
          BASE: ${{ vars.PROGRESS_BASE_URL || 'https://progress.apcsexamprep.com' }}
        run: |
          if [ -z "${TODO_KEY:-}" ]; then
            echo "TODO_KEY not configured; skipping command center report."
            exit 0
          fi
          state=$([ "${{ job.status }}" = "success" ] && echo pass || echo fail)
          detail="run ${{ github.run_id }}"
          curl -sS -X POST "$BASE/api/command/checks" \
            -H "Authorization: Bearer $TODO_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; apcse-ci/1.0) Chrome/120.0.0.0 Safari/537.36" \
            -d "{\"source\":\"health\",\"check_id\":\"nightly-sweep\",\"state\":\"$state\",\"detail\":\"$detail\"}" \
            || echo "report failed, ignoring"

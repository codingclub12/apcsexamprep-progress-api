name: Tests

# The OFFLINE smoke suites, run on every push and pull request.
#
# WHY THIS IS SEPARATE FROM smoke.yml
#   smoke.yml is production monitoring: it drives the real Shopify storefront
#   with a browser, so it runs once daily and on demand only. Driving the live
#   site repeatedly trips its bot protection, which is why it must never be a
#   per-push trigger.
#
#   The suites below touch no network at all. They build a throwaway SQLite file,
#   exercise the real routers in process, and delete it. They cost seconds, they
#   need no secrets, and they cannot generate production traffic. There was no
#   reason for them not to gate a pull request, and until now nothing did: every
#   PR reported zero checks, so "the suite is green" was a claim in a description
#   rather than an enforced fact.
#
# ADDING A SUITE
#   Add its npm script to SUITES below. The only bar is that it must not need
#   network or secrets. smoke:auth and smoke:teacher are excluded because they
#   drive a browser against production, and smoke:cleanup because it is a
#   destructive live tool that deactivates real rows, not a test.
#   A bare `push:` alongside `pull_request:` fires BOTH for every push to a PR
#   branch, running the whole suite twice for one commit. Restricting push to the
#   default branch means a PR is checked once via pull_request, and main is
#   checked again on merge, which is the state that actually ships.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-smoke:
    name: Offline smoke suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # better-sqlite3 is a native module; npm ci uses the lockfile so a
      # transitive bump can never silently change what is being tested.
      - name: Install
        run: npm ci

      # Every suite runs even after one fails, so a red build reports ALL the
      # damage rather than only the first thing to break. Failing fast here
      # would mean a second push to discover the second failure.
      - name: Run offline smoke suites
        run: |
          set -uo pipefail

          # The suite list is DERIVED from package.json, not written out here.
          #
          # It used to be one long space-separated line, which made it a
          # guaranteed merge conflict: every agent adding a suite edited the
          # same line, so any two PRs open at once collided on it. One branch
          # hit that three times in 45 minutes. Adding a suite is now nothing
          # but its npm script, and CI picks it up with no workflow edit.
          #
          # EXCLUDE is the opposite list, and it is the one that needs a reason.
          # These are the smoke:* scripts that must NOT run here:
          #   install  - npm helper, not a suite
          #   auth     - drives a real browser against the live storefront
          #   teacher  - same, and needs credential secrets
          #   pages    - hits the live Shopify Admin API
          #   cleanup  - destructive live tool that deactivates real rows
          # Everything else is offline, secret-free, and safe to gate a PR.
          EXCLUDE="install auth teacher pages cleanup"

          SUITES=$(node -e '
            const scripts = Object.keys(require("./package.json").scripts);
            const exclude = new Set(process.argv[1].split(" "));
            const suites = scripts
              .filter((k) => k.startsWith("smoke:"))
              .map((k) => k.slice("smoke:".length))
              .filter((s) => !exclude.has(s));
            if (!suites.length) { console.error("no suites resolved"); process.exit(1); }
            console.log(suites.join(" "));
          ' "$EXCLUDE")

          echo "Derived $(echo "$SUITES" | wc -w) suites from package.json:"
          echo "  $SUITES"
          echo

          failed=""
          for s in $SUITES; do
            echo "::group::smoke:$s"
            if npm run --silent "smoke:$s"; then
              echo "PASS  smoke:$s"
            else
              echo "FAIL  smoke:$s"
              failed="$failed $s"
            fi
            echo "::endgroup::"
          done

          echo
          echo "──────────────────────────────────────────"
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            for s in $failed; do
              echo "::error title=smoke:$s::smoke:$s failed. Reproduce locally with: npm run smoke:$s"
            done
            exit 1
          fi
          echo "All offline smoke suites passed."

      # Report each suite's result to the command center, so a suite that goes
      # red on main opens ONE task that ages until it is fixed, and closes
      # itself when it goes green again (spec section 12).
      #
      # main only: a red PR is already visible as a failed check, and reporting
      # from PR runs would open tasks for work in progress. Never fails the job
      # (`|| true` plus continue-on-error): the command center is an observer,
      # and an observer that can break the build is a liability. Skipped
      # entirely when the secret is absent, so a fork or an unconfigured repo
      # sees no difference.
      - name: Report suite results to the command center
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TODO_KEY: ${{ secrets.TODO_KEY }}
        run: |
          if [ -z "${TODO_KEY:-}" ]; then
            echo "TODO_KEY not configured; skipping command center report."
            exit 0
          fi
          state=$([ "${{ job.status }}" = "success" ] && echo pass || echo fail)
          curl -sS -X POST https://progress.apcsexamprep.com/api/command/checks \
            -H "Authorization: Bearer $TODO_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; apcse-ci/1.0) Chrome/120.0.0.0 Safari/537.36" \
            -d "{\"source\":\"ci\",\"check_id\":\"offline-smoke\",\"state\":\"$state\",\"detail\":\"run ${{ github.run_id }} on ${{ github.sha }}\"}" \
            || echo "report failed, ignoring"

      # A suite must not modify anything that is committed. Its throwaway .db is
      # expected and gitignored (each suite unlinks its own at startup, so the
      # last run stays inspectable), but a TRACKED file changing means a test
      # wrote into the repo, which would make the next run depend on this one.
      - name: Tests did not modify tracked files
        run: |
          dirty=$(git status --porcelain -- . || true)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error title=repo modified::A suite modified a tracked file. Tests must not write into the repo."
            exit 1
          fi
          echo "No tracked file was modified."

name: Daily site audit

# ─────────────────────────────────────────────────────────────────────────────
#  THE CRAWLER WAS BUILT AND THEN NEVER SCHEDULED.
#
#  lib/site-crawl.js and scripts/site-crawl.js have existed, fully written and
#  pinned by 110 offline assertions in smoke/site-crawl.js, and appeared in NO
#  workflow. Everything they were built to catch was still being found by a human
#  opening a page, which is the same failure page-availability.js had before
#  board task 117 put it on a schedule.
#
#  The 2026-08-26 audit is the cost of that. It found, by hand, defects the
#  crawler already knew how to see: a school year that had ended sitting in the
#  title of thirteen pages and seven products, the store name twice in three
#  product titles, and scraped navigation furniture serving as the search snippet
#  on every Command Center. None of it was new that morning. It had simply never
#  been looked at.
#
#  ── WHY 09:00 AND NOT 08:00 ─────────────────────────────────────────────────
#  Four jobs already drive the storefront: auto-dispatch at 06:00, the browser
#  smoke at 07:00, the board sweep at 08:00. Stacking a fifth on top of the sweep
#  would put two crawlers on the store in the same minute, which is the mistake
#  .github/workflows/smoke.yml documents and board task 79 paid for. 09:00 sits
#  clear of all of them.
#
#  ── WHY IT DOES NOT WRITE TO THE BOARD ──────────────────────────────────────
#  Same posture as the overnight sweep: it reads and reports, it does not file.
#  A crawler that opens tasks unattended turns one template regression into
#  1,300 rows. The report is the artifact; a human decides what becomes a task.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Crawl every URL rather than tonight''s shard (slow, ~35 min)'
        required: false
        type: boolean
        default: false
      budget:
        description: 'Max page requests'
        required: false
        default: '400'

# Shared with the board sweep and the reconcile, by name, so no two jobs can
# drive the storefront at once. Concurrency groups match across workflows.
concurrency:
  group: verify-board
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Crawl the site and rank what is wrong
    runs-on: ubuntu-latest
    # The crawler's own --max-minutes is the real guarantee; this is the backstop
    # under it, because a job-level timeout cannot write a report explaining
    # itself and the crawler can.
    timeout-minutes: 45

    steps:
      # Full history, for one reason: the api-stale-deploy check dates the
      # commit production is actually serving, and the default depth-1 checkout
      # contains exactly one commit, so that sha is never resolvable. The check
      # degrades gracefully without this and still fires, but it can only say
      # "not main" instead of "production is running code from 23 hours ago",
      # and the second sentence is the one that gets someone to open Railway.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      # Last night's findings, so tonight can say what is NEW rather than
      # re-reading the same 1,300-page template defect as news every morning.
      # A cache miss is normal on the first run and the delta reports "no
      # baseline" instead of calling everything new.
      - name: Restore last night's findings
        uses: actions/cache/restore@v4
        with:
          path: previous-crawl.json
          key: site-crawl-${{ github.run_id }}
          restore-keys: |
            site-crawl-

      - name: Crawl
        id: crawl
        env:
          STORE_ORIGIN: https://www.apcsexamprep.com
          APCS_BASE: ${{ vars.PROGRESS_BASE_URL || 'https://progress.apcsexamprep.com' }}
        run: |
          # pipefail, or `node ... | tee` reports tee's status and a dead
          # crawler lands as a green tick. This workflow's sibling shipped that
          # exact bug once already.
          set -o pipefail

          ARGS="--out current-crawl.json --budget ${{ inputs.budget || '400' }} --max-minutes 30"
          if [ -f previous-crawl.json ]; then
            ARGS="$ARGS --previous previous-crawl.json"
          else
            echo "No baseline from a previous run. Tonight establishes one."
          fi
          if [ "${{ inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi

          echo "site-crawl.js $ARGS"
          # The crawler's exit code is needed by the annotation step BELOW, and a
          # failing step hands nothing forward, so it is recorded before the step
          # exits with it. PIPESTATUS[0] rather than $? because of the tee.
          set +e
          node scripts/site-crawl.js $ARGS 2>&1 | tee crawl-report.txt
          crawl_code=${PIPESTATUS[0]}
          set -e
          echo "code=$crawl_code" >> "$GITHUB_OUTPUT"
          exit "$crawl_code"

      # ── WHY IS IT RED ──────────────────────────────────────────────────────
      #  site-crawl.js exits 1 for three different reasons and the Actions list
      #  shows one red X for all of them. This audit "failed" on 2026-08-29,
      #  08-30, 08-31 and 09-01, and nobody opened a report, because a red X
      #  reads as a broken job. It was not broken: the complete-picture step
      #  passed on all four, so aborted and truncated were both null and every
      #  one of those runs was a healthy crawl reporting real findings.
      #
      #  The full report already reaches the job summary, so nothing is missing.
      #  What was missing is a reason on the OUTSIDE of the box. An annotation is
      #  the only text that appears next to the red X itself.
      #
      #  It never fails: an explainer that can fail the build is one more way for
      #  the audit to look broken.
      - name: Say why this run is red
        if: always()
        continue-on-error: true
        run: node scripts/crawl-annotations.js current-crawl.json "${{ steps.crawl.outputs.code }}"

      # ── A RED RUN IS USUALLY THE ALARM, NOT A BROKEN JOB ────────────────────
      #  site-crawl.js exits 1 for THREE different reasons: it found a P0, it
      #  aborted on throttling, or it ran out of wall clock. Only the first is
      #  the crawler working as designed, and on this site P0s are not rare, so
      #  a red X here is the normal state of a working audit.
      #
      #  That distinction matters because of what it gates. The first version of
      #  this workflow saved the baseline `if: success()`, copied from
      #  nightly-sweep.yml where a failed sweep genuinely must not poison the
      #  next morning. Here it meant the baseline was saved only on a night with
      #  zero P0s. Run 1 found three, saved nothing, and every night after it
      #  would have reported "no baseline to compare against" forever. The delta
      #  half of this job would have been dead while the job still printed a
      #  full report every morning, which is the exact shape of a check that
      #  looks like it works.
      #
      #  So the gate is a positive test on the artifact rather than on the exit
      #  code: the crawl JSON must exist, parse, and carry null for both
      #  `aborted` and `truncated`. A run that collected a complete picture is a
      #  valid baseline no matter how much it found wrong.
      - name: Did the crawl collect a complete picture
        id: complete
        if: always()
        run: |
          usable=false
          reason="current-crawl.json was never written"
          if [ -f current-crawl.json ]; then
            read -r usable reason < <(node -e '
              try {
                const j = JSON.parse(require("fs").readFileSync("current-crawl.json", "utf8"));
                if (j.aborted) console.log(`false aborted:${String(j.aborted).slice(0,40)}`);
                else if (j.truncated) console.log(`false truncated:${String(j.truncated).slice(0,40)}`);
                else console.log("true complete");
              } catch (e) { console.log("false unparseable"); }
            ')
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"
          echo "Baseline usable: $usable ($reason)"
          {
            if [ "$usable" = "true" ]; then
              echo "Baseline saved for tomorrow's delta. A red run that found problems is this job working."
            else
              echo "Baseline NOT saved: $reason. Tomorrow will have nothing to compare against."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The report is the deliverable, and it belongs where it can be read on a
      # phone without downloading anything.
      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '## Daily site audit'
            echo
            echo '```'
            # A very long report would blow the 1MB summary limit, so the tail
            # is dropped rather than the head: the ranking puts what matters
            # first, and a truncated summary says so.
            head -c 900000 crawl-report.txt
            if [ "$(wc -c < crawl-report.txt)" -gt 900000 ]; then
              echo
              echo '... report truncated for the summary. Full text is in the artifact.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-${{ github.run_number }}
          path: |
            crawl-report.txt
            current-crawl.json
          retention-days: 30

      # Saved only on success, so a crawl that died halfway cannot poison the
      # baseline and make tomorrow report phantom resolutions.
      - name: Save tonight's findings as the baseline
        if: always() && steps.complete.outputs.usable == 'true'
        run: cp current-crawl.json previous-crawl.json

      - uses: actions/cache/save@v4
        if: always() && steps.complete.outputs.usable == 'true'
        with:
          path: previous-crawl.json
          key: site-crawl-${{ github.run_id }}

      # ── TELL THE BOARD ──────────────────────────────────────────────────────
      #  Board task 166. This audit has exited 1 since 2026-08-28 and the board
      #  read `checks: {total: 2, failing: 0}` the whole time, because nothing
      #  here posted to /api/command/checks. This step does NOT change why the
      #  crawl exits 1 (the crawler's own comment above explains three different
      #  reasons collapse into one red X, and a red run finding real problems is
      #  this job working, not broken) - it only wires the existing verdict
      #  through, same as deploy-drift.yml already does for its own three-way
      #  exit code. Fixing what site-audit finds is explicitly out of scope here;
      #  making its redness visible is the whole point.
      #
      #  source=linkcheck: this crawls the live Shopify storefront, which is
      #  exactly SURFACE_BY_SOURCE's linkcheck -> shopify mapping in
      #  lib/command-checks.js, and it is a "scheduled ... check on known-
      #  critical URLs" in the sense command-checks.js's SOURCES comment means.
      #
      #  `if: always()` so it reports even though the crawl step above can exit
      #  1 with no continue-on-error; `job.status != 'cancelled'` for a run that
      #  crawled nothing; continue-on-error so the observer cannot make this
      #  audit look more broken than it is; a missing TODO_KEY skips.
      - name: Report to the command center
        if: always() && job.status != 'cancelled'
        continue-on-error: true
        env:
          TODO_KEY: ${{ secrets.TODO_KEY }}
          BASE: ${{ vars.PROGRESS_BASE_URL || 'https://progress.apcsexamprep.com' }}
        run: |
          if [ -z "${TODO_KEY:-}" ]; then
            echo "TODO_KEY not configured; skipping command center report."
            exit 0
          fi
          state=$([ "${{ job.status }}" = "success" ] && echo pass || echo fail)
          detail="run ${{ github.run_id }}"
          curl -sS -X POST "$BASE/api/command/checks" \
            -H "Authorization: Bearer $TODO_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; apcse-ci/1.0) Chrome/120.0.0.0 Safari/537.36" \
            -d "{\"source\":\"linkcheck\",\"check_id\":\"site-audit\",\"state\":\"$state\",\"detail\":\"$detail\"}" \
            || echo "report failed, ignoring"

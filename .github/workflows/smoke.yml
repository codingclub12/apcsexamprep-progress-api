name: Auth Smoke Test

# Runs the real-browser auth + enrollment smoke test against production.
# - workflow_dispatch: a manual "Run workflow" button (available once this file
#   is on the default branch).
# - push: fires immediately when the smoke test or this workflow changes on the
#   feature branch, so a run can be forced by pushing.
on:
  workflow_dispatch:
  # Once daily. This is production monitoring, and driving the live Shopify site
  # repeatedly trips its bot/rate protection (rapid runs started serving empty
  # pages). A per-push trigger was removed for that reason - trigger extra runs
  # with the "Run workflow" button (available once this workflow is on the
  # default branch). schedule + workflow_dispatch only fire from the default
  # branch, so no run fires from the feature branch.
  schedule:
    - cron: '0 7 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_TEACHER_EMAIL: ${{ secrets.SMOKE_TEACHER_EMAIL }}
      SMOKE_TEACHER_PASSWORD: ${{ secrets.SMOKE_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install smoke deps
        run: npm run smoke:install

      - name: Install Chromium
        working-directory: smoke
        run: npx playwright install --with-deps chromium

      - name: Run auth smoke test
        run: npm run smoke:auth
        env:
          # These are class codes, not secrets; all five are disposable test
          # classes owned by Tanner.
          SMOKE_TEST_CLASS_CODE: CYBER-Q9JG,CSA-CQ3G,CSP-CHSH,CSA-4UC8,CYBER-U89X

      # Teacher class dashboard check (read-only: teacher login + per-class
      # dashboard render + teacher-API data verification). Needs the teacher
      # credential secrets; skipped until they are configured.
      - name: Run teacher dashboard smoke test
        if: ${{ always() && env.SMOKE_TEACHER_EMAIL != '' }}
        run: npm run smoke:teacher
        env:
          SMOKE_TEST_CLASS_CODE: CYBER-Q9JG,CSA-CQ3G,CSP-CHSH,CSA-4UC8,CYBER-U89X

      # Optional: deactivate the ZZ-SMOKE students this run created. Only runs if
      # the teacher credentials are provided as repo secrets; otherwise skipped.
      - name: Cleanup sentinel students
        if: ${{ always() && env.SMOKE_TEACHER_EMAIL != '' }}
        run: npm run smoke:cleanup
        env:
          SMOKE_TEST_CLASS_CODE: CYBER-Q9JG,CSA-CQ3G,CSP-CHSH,CSA-4UC8,CYBER-U89X

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            artifacts/
            created-artifacts.json
          if-no-files-found: ignore

      # ── TELL THE BOARD ──────────────────────────────────────────────────────
      #  Board task 166: this is "a nightly browser smoke, invisible to users"
      #  from task 85's own routing note, and it never told the board anything.
      #  Same reporting gap as deploy-drift.yml before 2026-09-01, sixth of
      #  seven instances.
      #
      #  source=smoke: this is the literal thing lib/command-checks.js's SOURCES
      #  comment means by "nightly production smoke" - it drives a real browser
      #  against production, unlike tests.yml's offline suites (source=ci).
      #
      #  job.status here reflects `smoke:auth`, which always runs; the teacher
      #  and cleanup steps are conditional on a secret and skipping them does
      #  not flip job.status, so this cannot repeat the railway-deploy trap
      #  (there is no path where every real step skips and the job still says
      #  success - smoke:auth is unconditional).
      #
      #  `if: always()` so a failed smoke:auth still reports; `job.status !=
      #  'cancelled'` for a run that tested nothing; continue-on-error so the
      #  observer cannot turn production monitoring red by itself; a missing
      #  TODO_KEY skips rather than fails.
      - name: Report to the command center
        if: always() && job.status != 'cancelled'
        continue-on-error: true
        env:
          TODO_KEY: ${{ secrets.TODO_KEY }}
          BASE: ${{ vars.PROGRESS_BASE_URL || 'https://progress.apcsexamprep.com' }}
        run: |
          if [ -z "${TODO_KEY:-}" ]; then
            echo "TODO_KEY not configured; skipping command center report."
            exit 0
          fi
          state=$([ "${{ job.status }}" = "success" ] && echo pass || echo fail)
          detail="run ${{ github.run_id }}"
          curl -sS -X POST "$BASE/api/command/checks" \
            -H "Authorization: Bearer $TODO_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; apcse-ci/1.0) Chrome/120.0.0.0 Safari/537.36" \
            -d "{\"source\":\"smoke\",\"check_id\":\"auth-smoke\",\"state\":\"$state\",\"detail\":\"$detail\"}" \
            || echo "report failed, ignoring"
